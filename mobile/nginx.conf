server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  location /healthz { access_log off; return 200 'ok'; add_header Content-Type text/plain; }
  # PWA (FR-19.5, FR-19.9): SW, manifest, shell-ийг үргэлж дахин шалгана — шинэ хувилбар хоцрохгүй
  location = /sw.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
  location = /manifest.json { add_header Cache-Control "no-cache"; default_type application/manifest+json; try_files $uri =404; }
  location = /index.html { add_header Cache-Control "no-cache"; }
  # Hash-тай нэртэй bundle — өөрчлөгддөггүй
  location /_expo/static/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
  location / { try_files $uri /index.html; }
}
