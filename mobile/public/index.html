      Дүрс ба splash: `node scripts/generate-pwa-icons.mjs`. Өнгө = tokens.ts-ийн бараан `bg` (pwaHtml.test.ts).
    -->
    <meta charset="utf-8" />

    <!-- react-native-web-ийн зөвлөсөн reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        background-color: #0D0C0E;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /*
        iOS «Нүүр дэлгэцэнд нэмэх» (standalone + black-translucent): вэб харагдац статус мөрийн доор орж,
        `height: 100%` нь статус мөрийн өндрөөр богино болдог тул агуулга цаг/цэнэгтэй давхцаж, доод талд
        хоосон зурвас үлддэг байв. #root-ийг дэлгэцэнд бэхэлж, дээд/хажуугийн safe area-г CSS env()-ээр
        шууд зайлуулна — env() нь амьдаар шинэчлэгддэг. react-native-safe-area-context нь provider-ийн
        байрлалаар inset-ээ хасдаг (rect.top) тул давхар зай үүсэхгүй; доод inset-ийг TabBar өөрөө авна.
        Android/desktop-д env() = 0 тул өөрчлөлтгүй.
      */
      @supports (padding-top: env(safe-area-inset-top)) {
        #root {
          position: fixed;
          top: 0;
          right: 0;
          bottom: 0;
          left: 0;
          height: auto;
          box-sizing: border-box;
          padding-top: env(safe-area-inset-top);
          padding-left: env(safe-area-inset-left);
          padding-right: env(safe-area-inset-right);
        }
      }
      /*
        Оролтын талбарт хөтчийн өгөгдмөл (iOS Safari-д цэнхэр дөрвөлжин) focus хүрээг хасна — TextField,
        CodeInput, ChatComposer өөрсдөө focus-ийг хүрээний өнгөөр (primary) харуулдаг.
      */
      input:focus,
      textarea:focus {
        outline: none;
      }
      input,
      textarea,
      [role='button'] {
        -webkit-tap-highlight-color: transparent;
      }
      /* S-01 static splash: JS ачаалагдаж, React эхний рендэрээ хийтэл (createRoot нь #root-ыг цэвэрлэнэ) */
      #aura-splash {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        color: #F5EDEA;
        font-family: 'Playfair Display', Georgia, 'Times New Roman', serif;
        font-style: italic;
        font-size: 40px;
        line-height: 44px;
      }
      #aura-splash img {
        width: 224px;
        height: 224px;
        border-radius: 48px;
      }
    </style>
  </head>

  <body>
    <noscript>Aura-г ашиглахын тулд JavaScript-ийг асаана уу. · Please enable JavaScript to use Aura.</noscript>
    <!-- S-01 (FR-19.10): эхний будалт JS-ийг хүлээхгүй — LCP нь энэ splash; апп рендэрлэхэд солигдоно -->
    <div id="root"><div id="aura-splash" role="img" aria-label="Aura"><img src="/icons/icon-512.png" alt="" width="224" height="224" fetchpriority="high" /><span aria-hidden="true">Aura</span></div></div>
  </body>
</html>
