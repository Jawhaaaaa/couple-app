      type: object
      required: [occasionKey, source, title, nextOn, daysUntil]
      properties:
        occasionKey: {$ref: '#/components/schemas/OccasionKey'}
        source: {$ref: '#/components/schemas/OccasionSource'}
        title: {type: string}
        kind: {$ref: '#/components/schemas/OccasionKind'}
        nextOn: {type: string, format: date, example: '2026-11-07'}
        daysUntil: {type: integer, minimum: 0}
    MemorySummary:
      type: object
      required: [id, title, occurredOn, visibility, status, author, mediaCount, commentCount, favorite, createdAt]
      properties:
        id: {type: string, format: uuid, example: 0192f3a4-0000-7000-8000-0000000000a1}
