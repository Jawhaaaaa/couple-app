      type: object
      required: [id, theme, status, proposer, createdAt]
      properties:
        id: {type: string, format: uuid, example: 0192f3a4-5b6c-7d8e-9f01-23456789abcd}
        theme: {$ref: '#/components/schemas/Theme'}
        status:
          type: string
          enum: [PENDING, ACCEPTED, DECLINED]
