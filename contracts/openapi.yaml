    PairingRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code: {type: string, pattern: '^AURA-[ABCDEFGHJKLMNPQRSTUVWXYZ23456789]{4}$', example: AURA-7K3M}
