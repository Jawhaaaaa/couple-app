components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT, description: 'Access JWT (15 мин, HS256) — DD-AURA-006'}
  parameters:
    sessionId:
      name: sessionId
      in: path
      required: true
      schema: {type: string, format: uuid, example: 0192f3a4-5b6c-7d8e-9f01-23456789abcd}
    inviteId:
      name: inviteId
      in: path
      required: true
      schema: {type: string, format: uuid, example: 0192f3a4-5b6c-7d8e-9f01-23456789abcd}
    pairingId:
      name: pairingId
      in: path
      required: true
      schema: {type: string, format: uuid, example: 0192f3a4-5b6c-7d8e-9f01-23456789abcd}
    proposalId:
      name: proposalId
      in: path
      required: true
      schema: {type: string, format: uuid, example: 0192f3a4-5b6c-7d8e-9f01-23456789abcd}
    uploadId:
      name: uploadId
      in: path
      required: true
      schema: {type: string, format: uuid, example: 0192f3a4-5b6c-7d8e-9f01-23456789abcd}
    mediaId:
      name: mediaId
      in: path
      required: true
      schema: {type: string, format: uuid, example: 0192f3a4-5b6c-7d8e-9f01-23456789abcd}
    memoryId:
      name: memoryId
      in: path
      required: true
      schema: {type: string, format: uuid, example: 0192f3a4-5b6c-7d8e-9f01-23456789abcd}
    commentId:
      name: commentId
      in: path
      required: true
      schema: {type: string, format: uuid, example: 0192f3a4-5b6c-7d8e-9f01-23456789abcd}
    groupId:
      name: groupId
      in: path
      required: true
      schema: {type: string, format: uuid, example: 0192f3a4-5b6c-7d8e-9f01-23456789abcd}
    recapId:
      name: recapId
      in: path
      required: true
      schema: {type: string, format: uuid, example: 0192f3a4-5b6c-7d8e-9f01-23456789abcd}
    exportId:
      name: exportId
      in: path
      required: true
      schema: {type: string, format: uuid, example: 0192f3a4-5b6c-7d8e-9f01-23456789abcd}
    messageId:
      name: messageId
      in: path
      required: true
      schema: {type: string, format: uuid, example: 0192f3a4-5b6c-7d8e-9f01-23456789abcd}
    promiseId:
      name: promiseId
      in: path
      required: true
      schema: {type: string, format: uuid, example: 0192f3a4-5b6c-7d8e-9f01-23456789abcd}
    ideaId:
      name: ideaId
      in: path
      required: true
      schema: {type: string, format: uuid, example: 0192f3a4-5b6c-7d8e-9f01-23456789abcd}
    planId:
      name: planId
      in: path
      required: true
      schema: {type: string, format: uuid, example: 0192f3a4-5b6c-7d8e-9f01-23456789abcd}
    itemId:
      name: itemId
      in: path
      required: true
      schema: {type: string, format: uuid, example: 0192f3a4-5b6c-7d8e-9f01-23456789abcd}
    expenseId:
      name: expenseId
      in: path
      required: true
      schema: {type: string, format: uuid, example: 0192f3a4-5b6c-7d8e-9f01-23456789abcd}
    anniversaryId:
      name: anniversaryId
      in: path
      required: true
      schema: {type: string, format: uuid, example: 0192f3a4-5b6c-7d8e-9f01-23456789abcd}
    giftIdeaId:
      name: giftIdeaId
      in: path
      required: true
      schema: {type: string, format: uuid, example: 0192f3a4-5b6c-7d8e-9f01-23456789abcd}
    goalId:
      name: goalId
      in: path
      required: true
      schema: {type: string, format: uuid, example: 0192f3a4-5b6c-7d8e-9f01-23456789abcd}
    stepId:
      name: stepId
      in: path
      required: true
      schema: {type: string, format: uuid, example: 0192f3a4-5b6c-7d8e-9f01-23456789abcd}
    contributionId:
      name: contributionId
      in: path
      required: true
      schema: {type: string, format: uuid, example: 0192f3a4-5b6c-7d8e-9f01-23456789abcd}
    letterId:
      name: letterId
      in: path
      required: true
      schema: {type: string, format: uuid, example: 0192f3a4-5b6c-7d8e-9f01-23456789abcd}
    capsuleId:
      name: capsuleId
      in: path
      required: true
      schema: {type: string, format: uuid, example: 0192f3a4-5b6c-7d8e-9f01-23456789abcd}
    notificationId:
      name: notificationId
      in: path
      required: true
      schema: {type: string, format: uuid, example: 0192f3a4-5b6c-7d8e-9f01-23456789abcd}
    subscriptionId:
      name: subscriptionId
      in: path
      required: true
      schema: {type: string, format: uuid, example: 0192f3a4-5b6c-7d8e-9f01-23456789abcd}
    userId:
      name: userId
      in: path
      required: true
      schema: {type: string, format: uuid, example: 0192f3a4-5b6c-7d8e-9f01-23456789abcd}
    sinkId:
      name: sinkId
      in: path
      required: true
      schema: {type: string, format: uuid, example: 0192f3a4-5b6c-7d8e-9f01-23456789abcd}
    provider:
      name: provider
      in: path
      required: true
      schema:
        type: string
        enum: [google, apple]
      description: apple нь `aura.oauth.apple.enabled=false` үед 404 PROVIDER_DISABLED
    listKind:
      name: listKind
      in: path
      required: true
      schema:
        type: string
        enum: [bucket, todo, shopping, wishlist]
    occasionKey:
      name: occasionKey
      in: path
      required: true
      schema: {$ref: '#/components/schemas/OccasionKey'}
    taskKey:
      name: taskKey
      in: path
      required: true
      schema: {type: string, example: first-memory}
    localDate:
      name: localDate
      in: path
      required: true
      schema: {type: string, format: date, example: '2026-11-07'}
    eventKey:
      name: eventKey
      in: path
      required: true
      schema: {type: string, example: 'milestone:days:1000'}
    jobName:
      name: jobName
      in: path
      required: true
      schema: {type: string, example: letterDelivery}
    year:
      name: year
      in: path
      required: true
      schema: {type: integer, minimum: 2000, maximum: 2100}
    credentialId:
      name: credentialId
      in: path
      required: true
      schema: {type: string, description: base64url WebAuthn credential ID}
    libraryId:
      name: libraryId
      in: path
      required: true
      schema: {type: string, example: lib-winter-012}
      description: Агуулгын сангийн тогтвортой ID (uuid биш)
    index:
      name: index
      in: path
      required: true
      schema: {type: integer, minimum: 0}
      description: Chunk-ийн индекс (0-ээс)
    cursor:
      name: cursor
      in: query
      required: false
      schema: {type: string}
      description: Өмнөх хуудасны `nextCursor`
    limit:
      name: limit
      in: query
      required: false
      schema: {type: integer, minimum: 1, maximum: 100, default: 30}
  responses:
    BadRequest:
      description: Оролтын алдаа — `VALIDATION_FAILED` + `fieldErrors[]` эсвэл тодорхой код
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    Unauthorized:
      description: Токен байхгүй/хүчингүй/хугацаа дууссан эсвэл нэвтрэх мэдээлэл буруу
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    Forbidden:
      description: Эрхгүй — `ACCOUNT_SUSPENDED`, `NOT_OWNER`, `ADMIN_ONLY` г.м.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    NotFound:
      description: Олдсонгүй эсвэл өөр space-ийнх (DD-AURA-004)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    Conflict:
      description: Төлөвийн зөрчил. `VERSION_CONFLICT` үед серверийн одоогийн хувилбартай
      content:
        application/json:
          schema:
            oneOf:
            - allOf:
              - {$ref: '#/components/schemas/ApiError'}
              - type: object
                properties:
                  code:
                    not: {const: VERSION_CONFLICT}
            - {$ref: '#/components/schemas/VersionConflictError'}
    Gone:
      description: Хугацаа дууссан эсвэл хүчингүй болсон
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    PayloadTooLarge:
      description: Хэмжээ хэтэрсэн — `MEDIA_TOO_LARGE`
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    UnsupportedMediaType:
      description: Зөвшөөрөгдөөгүй төрөл — `MEDIA_TYPE_FORBIDDEN`
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    Locked:
      description: Түгжигдсэн — `SPACE_READ_ONLY` (AC-127), `CODE_LOCKED`, `INVITE_LOCKED`
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    TooManyRequests:
      description: Хязгаар хэтэрсэн — `RATE_LIMITED` + `retryAfterSeconds`
      headers:
        Retry-After:
          description: Дахин оролдох хүртэлх секунд
          schema: {type: integer, minimum: 0}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    ServiceUnavailable:
      description: Гадаад үйлчилгээ хүрэхгүй — `UPSTREAM_UNAVAILABLE`
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    InsufficientStorage:
      description: Хосын хадгалах сангийн квот дүүрсэн — `STORAGE_QUOTA_EXCEEDED`
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
  schemas:
    ErrorCode:
      type: string
      description: Машинаар уншигдах алдааны код. Client нь `message`-ийг биш кодыг шалгана.
      enum: [VALIDATION_FAILED, TOKEN_INVALID, TOKEN_EXPIRED, ACCOUNT_SUSPENDED, NOT_FOUND, NOT_OWNER, NOT_PAIRED, VERSION_CONFLICT, SPACE_READ_ONLY,
        RATE_LIMITED, INTERNAL, UPGRADE_REQUIRED, PASSWORD_WEAK, PASSWORD_COMMON, AGE_RESTRICTED, POLICY_NOT_ACCEPTED, CODE_INVALID, CODE_LOCKED,
        CODE_EXPIRED, AUTH_INVALID_CREDENTIALS, AUTH_EMAIL_NOT_VERIFIED, AUTH_SESSION_REVOKED, PROVIDER_DISABLED, MEDIA_TOO_LARGE, MEDIA_TYPE_FORBIDDEN,
        SURVEY_NOT_DUE, UPSTREAM_UNAVAILABLE, ALREADY_PAIRED, PAIRING_COOLDOWN, INVITE_INVALID, INVITE_LOCKED, ALREADY_DECIDED, NOT_BREAKING,
        ALREADY_ANSWERED, TEXT_TOO_LONG, VIDEO_TOO_LONG, AUDIO_TOO_LONG, STORAGE_QUOTA_EXCEEDED, CHUNK_SIZE_MISMATCH, UPLOAD_INCOMPLETE, MEDIA_LIMIT_EXCEEDED,
        EXPORT_EXPIRED, EXPORT_NOT_READY, MESSAGE_DELETED, PROMISE_NOT_ENDED, PLAN_NOT_PENDING, ALREADY_SWIPED, LETTER_ALREADY_DELIVERED, CAPSULE_SEALED,
        CHECKIN_PAST_DAY, PASSKEY_INVALID, ADMIN_ONLY]
    FieldError:
      type: object
      required: [field, code, message]
      properties:
        field: {type: string, description: JSON зам, example: password}
        code: {type: string, example: PASSWORD_WEAK}
        message: {type: string}
    ApiError:
      type: object
      description: Алдааны нийтлэг бие. `message` нь `Accept-Language` (mn/en)-ээр орчуулагдана.
      required: [code, message, traceId]
      properties:
        code: {$ref: '#/components/schemas/ErrorCode'}
        message: {type: string, example: Нууц үг хэт сул байна}
        traceId: {type: string, example: 4bf92f3577b34da6a3ce929d0e0e4736}
        fieldErrors:
          type: array
          items: {$ref: '#/components/schemas/FieldError'}
        retryAfterSeconds: {type: integer, minimum: 0, example: 60}
        details: {type: object, additionalProperties: true, description: 'Кодоос хамаарах нэмэлт — `attemptsLeft` (CODE_INVALID), `availableAt`
            (PAIRING_COOLDOWN) г.м.'}
    VersionConflictError:
      description: '`VERSION_CONFLICT` — серверийн одоогийн хувилбартай (DD-AURA-016).'
      allOf:
      - {$ref: '#/components/schemas/ApiError'}
      - type: object
        required: [code, current, currentVersion]
        properties:
          code: {const: VERSION_CONFLICT}
          current: {type: object, additionalProperties: true, description: Серверийн одоогийн объект (тухайн endpoint-ийн гаралтын хэлбэр)}
          currentVersion: {type: integer, format: int64, minimum: 0, example: 4}
          updatedBy:
            type: [string, 'null']
            format: uuid
            example: 0192f3a4-5b6c-7d8e-9f01-23456789abcd
    AcceptedResponse:
      type: object
      description: Бүртгэлтэй эсэхээс үл хамааран ижил хариу (DD-AURA-031).
      required: [accepted]
      properties:
        accepted: {type: boolean, const: true}
    Locale:
      type: string
      enum: [mn, en]
      example: mn
    Timezone: {type: string, description: IANA бүс, example: Asia/Ulaanbaatar}
    MascotColor: {type: string, description: Дизайн токены нэр (hex биш)., pattern: '^[a-z][a-z0-9-]{1,31}$', example: coral}
    DevicePlatform:
      type: string
      enum: [IOS, ANDROID, WEB]
    DeviceInfo:
      type: object
      additionalProperties: false
      required: [name, platform]
      properties:
        name: {type: string, maxLength: 100, example: iPhone 15}
        platform: {$ref: '#/components/schemas/DevicePlatform'}
    MediaRef:
      type: object
      description: Медиа. `urls` нь 15 минутын presigned GET; дууссан бол `GET /media/{mediaId}` (DD-AURA-013).
      required: [id, kind, status, mime, sizeBytes, urls, urlsExpireAt]
      properties:
        id: {type: string, format: uuid, example: 0192f3a4-5b6c-7d8e-9f01-23456789abcd}
        kind:
          type: string
          enum: [IMAGE, VIDEO, AUDIO, FILE]
        status:
          type: string
          enum: [PENDING, PROCESSING, READY, FAILED]
        mime: {type: string, example: image/jpeg}
        sizeBytes: {type: integer, format: int64, minimum: 0}
        width:
          type: [integer, 'null']
          minimum: 1
        height:
          type: [integer, 'null']
          minimum: 1
        durationMs:
          type: [integer, 'null']
          minimum: 0
        blurhash:
          type: [string, 'null']
          example: LEHV6nWB2yk8pyo0adR*.7kCMdnj
        waveform:
          type: [array, 'null']
          description: 64 цэгийн долгион (0–1)
          maxItems: 64
          items: {type: number, minimum: 0, maximum: 1}
        fileName:
          type: [string, 'null']
        urls:
          type: object
          required: [original]
          properties:
            original: {type: string, format: uri, example: 'https://s3.aura.example.mn/spaces/x/original?X-Amz-Signature=abc'}
            sm: {type: string, format: uri, example: 'https://aura.example.mn/'}
            md: {type: string, format: uri, example: 'https://aura.example.mn/'}
            lg: {type: string, format: uri, example: 'https://aura.example.mn/'}
            poster: {type: string, format: uri, example: 'https://aura.example.mn/'}
        urlsExpireAt: {type: string, format: date-time, example: '2026-11-07T12:45:00Z'}
    NullableMediaRef:
      oneOf:
      - {$ref: '#/components/schemas/MediaRef'}
      - {type: 'null'}
    UserRef:
      type: object
      required: [id, displayName]
      properties:
        id: {type: string, format: uuid, example: 0192f3a4-0000-7000-8000-00000000000a}
        displayName: {type: string, example: Бат}
        avatar: {$ref: '#/components/schemas/NullableMediaRef'}
    Place:
      type: object
      required: [name, lat, lon]
      properties:
        name: {type: string, maxLength: 200, example: Хустайн нуруу}
        lat: {type: number, minimum: -90, maximum: 90, example: 47.8}
        lon: {type: number, minimum: -180, maximum: 180, example: 106.0}
        city:
          type: [string, 'null']
        countryCode:
          type: [string, 'null']
          pattern: ^[A-Z]{2}$
          example: MN
    NullablePlace:
      oneOf:
      - {$ref: '#/components/schemas/Place'}
      - {type: 'null'}
    CityRef:
      type: object
      required: [name, countryCode, lat, lon, timezone]
      properties:
        name: {type: string, example: Улаанбаатар}
        countryCode: {type: string, pattern: '^[A-Z]{2}$', example: MN}
        lat: {type: number, minimum: -90, maximum: 90, example: 47.92}
        lon: {type: number, minimum: -180, maximum: 180, example: 106.92}
        timezone: {$ref: '#/components/schemas/Timezone'}
    SpaceSummary:
      type: object
      required: [id, kind, status]
      properties:
        id: {type: string, format: uuid, example: 0192f3a4-5b6c-7d8e-9f01-23456789abcd}
        kind:
          type: string
          enum: [SOLO, COUPLE]
        status: {$ref: '#/components/schemas/SpaceStatus'}
    SpaceStatus:
      type: string
      enum: [ACTIVE, BREAKING, ORPHANED, PURGING]
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password, displayName, birthDate, locale, timezone, acceptedPolicyVersion]
      properties:
        email: {type: string, format: email, maxLength: 254, example: bat@example.mn}
        password: {type: string, minLength: 8, maxLength: 128, description: Нийтлэг/алдагдсан жагсаалтад байхгүй}
        displayName: {type: string, minLength: 1, maxLength: 50, example: Бат}
        birthDate: {type: string, format: date, description: 18+ (AC-04), example: '1998-05-14'}
        locale: {$ref: '#/components/schemas/Locale'}
        timezone: {$ref: '#/components/schemas/Timezone'}
        acceptedPolicyVersion: {type: string, example: '2026-11-01'}
    VerifyEmailRequest:
      type: object
      additionalProperties: false
      required: [email, code]
      properties:
        email: {type: string, format: email, example: bat@example.mn}
        code: {type: string, pattern: '^[0-9]{6}$', example: '482913'}
    TokenRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: {type: string, minLength: 16, description: Имэйлийн холбоосын нэг удаагийн токен}
    EmailRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: {type: string, format: email, example: bat@example.mn}
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password, device]
      properties:
        email: {type: string, format: email, example: bat@example.mn}
        password: {type: string, minLength: 1, maxLength: 128}
        device: {$ref: '#/components/schemas/DeviceInfo'}
    RefreshRequest:
      type: object
      additionalProperties: false
      properties:
        refreshToken: {type: string, description: Native л. Web нь `aura_rt` cookie ашиглана}
    TokenResponse:
      type: object
      required: [accessToken, accessExpiresAt, user]
      properties:
        accessToken: {type: string, description: JWT (HS256), 15 мин: null}
        accessExpiresAt: {type: string, format: date-time, example: '2026-11-07T12:15:00Z'}
        refreshToken: {type: string, description: Зөвхөн native client-д; web-д `Set-Cookie aura_rt`}
        user: {$ref: '#/components/schemas/Me'}
    PasswordResetConfirm:
      type: object
      additionalProperties: false
      required: [token, newPassword]
      properties:
        token: {type: string, minLength: 16}
        newPassword: {type: string, minLength: 8, maxLength: 128}
    OAuthExchangeRequest:
      type: object
      additionalProperties: false
      required: [code, device]
      properties:
        code: {type: string, description: Callback-ийн нэг удаагийн код (60 с)}
        device: {$ref: '#/components/schemas/DeviceInfo'}
    OAuthExchangeResponse:
      type: object
      required: [linkRequired, isNewUser]
      properties:
        tokens:
          oneOf:
          - {$ref: '#/components/schemas/TokenResponse'}
          - {type: 'null'}
        linkRequired: {type: boolean}
        linkToken:
          type: [string, 'null']
        isNewUser: {type: boolean}
    OAuthLinkRequest:
      type: object
      additionalProperties: false
      required: [linkToken]
      properties:
        linkToken: {type: string}
        password: {type: string, maxLength: 128}
        emailCode: {type: string, pattern: '^[0-9]{6}$', example: '482913'}
    PolicyDocument:
      type: object
      required: [version, publishedAt, privacyMarkdown, termsMarkdown]
      properties:
        version: {type: string, example: '2026-11-01'}
        publishedAt: {type: string, format: date-time, example: '2026-11-07T12:00:00Z'}
        privacyMarkdown: {type: string}
        termsMarkdown: {type: string}
    VersionInfo:
      type: object
      required: [latest, minVersion, build, commitSha, updateAvailable, updateRequired]
      properties:
        latest: {type: string, pattern: '^[0-9]+\.[0-9]+\.[0-9]+$', example: 1.2.0}
        minVersion: {type: string, pattern: '^[0-9]+\.[0-9]+\.[0-9]+$', example: 1.0.0}
        build: {type: string, example: '142'}
        commitSha: {type: string, pattern: '^[0-9a-f]{7,40}$', example: 830fbfe}
        downloadUrl:
          type: [string, 'null']
          format: uri
          example: https://aura.example.mn/
        storeUrl:
          type: [string, 'null']
          format: uri
          example: https://aura.example.mn/
        updateAvailable: {type: boolean}
        updateRequired: {type: boolean}
    Me:
      type: object
      required: [id, email, displayName, birthDate, timezone, locale, emailVerified, policyVersionAccepted, policyUpdateRequired, onlineVisible,
        typingVisible, space]
      properties:
        id: {type: string, format: uuid, example: 0192f3a4-0000-7000-8000-00000000000a}
        email: {type: string, format: email, example: bat@example.mn}
        displayName: {type: string, example: Бат}
        callName:
          type: [string, 'null']
          maxLength: 50
        birthDate: {type: string, format: date, example: '1998-05-14'}
        timezone: {$ref: '#/components/schemas/Timezone'}
        locale: {$ref: '#/components/schemas/Locale'}
        city:
          oneOf:
          - {$ref: '#/components/schemas/CityRef'}
          - {type: 'null'}
        avatar: {$ref: '#/components/schemas/NullableMediaRef'}
        emailVerified: {type: boolean}
        policyVersionAccepted:
          type: [string, 'null']
