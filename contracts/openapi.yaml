          example: AURA-7K3M}
        link: {type: string, format: uri, example: 'https://aura.example.mn/i/AURA-7K3M'}
        expiresAt: {type: string, format: date-time, description: Үүсгэснээс 7 хоног, example: '2026-11-14T12:00:00Z'}
    InvitePreview:
      type: object
      required: [inviterName, expiresAt]
      properties:
        inviterName: {type: string}
