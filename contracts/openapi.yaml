        icon: {type: string, example: snow}
        attribution: {type: string, example: Open-Meteo (CC BY 4.0)}
    WeatherForecast:
      type: object
      required: [date, tempMinC, tempMaxC, code, icon, attribution]
      properties:
        date: {type: string, format: date, example: '2026-11-07'}
        tempMinC: {type: number}
        tempMaxC: {type: number}
        code: {type: integer}
        icon: {type: string}
        attribution: {type: string}
