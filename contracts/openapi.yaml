            mascotColor: {$ref: '#/components/schemas/MascotColor'}
        nextMeetupAt:
          type: [string, 'null']
          format: date-time
          example: '2026-11-07T12:00:00Z'
        isLongDistance: {type: boolean}
        readOnlyUntil:
          type: [string, 'null']
          format: date-time
          example: '2026-11-07T12:00:00Z'
        breakup:
          oneOf:
          - {$ref: '#/components/schemas/BreakupState'}
          - {type: 'null'}
