      properties:
        theme:
          type: string
          enum: [DARK, LIGHT, SYSTEM]
        dateFormat:
          type: string
          enum: [YMD_DOT, DMY_SLASH, MDY_SLASH]
        animation:
          type: string
          enum: [ALL, REDUCED, "OFF"]
        haptics: {type: boolean}
        sound: {type: boolean}
        checkinAutoShare: {type: boolean}
        mascotColor: {$ref: '#/components/schemas/MascotColor'}
        introSeen: {type: boolean}
        firstWeekHidden: {type: boolean}
