          maxItems: 5
          items: {type: string, format: uuid, example: 0192f3a4-5b6c-7d8e-9f01-23456789abcd}
        deliverAt:
          type: [string, 'null']
          format: date-time
          description: null = шууд
          example: '2026-11-07T12:00:00Z'
        occasionLabel: {type: string, maxLength: 80}
        draft: {type: boolean}
    LetterUpdate:
      type: object
      description: '`LetterInput` + `version`'
      additionalProperties: false
      required: [version]
      properties:
        template: {$ref: '#/components/schemas/LetterTemplate'}
        body: {type: string, maxLength: 20000}
        mediaIds:
          type: array
          maxItems: 5
          items: {type: string, format: uuid, example: 0192f3a4-5b6c-7d8e-9f01-23456789abcd}
        deliverAt:
          type: [string, 'null']
          format: date-time
          example: '2026-11-07T12:00:00Z'
        occasionLabel:
          type: [string, 'null']
          maxLength: 80
        draft: {type: boolean}
        version: {type: integer, format: int64, minimum: 0}
    Letter:
      type: object
      required: [id, author, recipient, template, body, media, status, createdAt, version]
      properties:
        id: {type: string, format: uuid, example: 0192f3a4-5b6c-7d8e-9f01-23456789abcd}
        author: {$ref: '#/components/schemas/UserRef'}
        recipient: {$ref: '#/components/schemas/UserRef'}
        template: {$ref: '#/components/schemas/LetterTemplate'}
        body: {type: string, maxLength: 20000}
        media:
          type: array
          maxItems: 5
          items: {$ref: '#/components/schemas/MediaRef'}
        deliverAt:
          type: [string, 'null']
          format: date-time
          example: '2026-11-07T12:00:00Z'
        occasionLabel:
          type: [string, 'null']
        status: {$ref: '#/components/schemas/LetterStatus'}
        deliveredAt:
          type: [string, 'null']
          format: date-time
          example: '2026-11-07T12:00:00Z'
        readAt:
          type: [string, 'null']
          format: date-time
          example: '2026-11-07T12:00:00Z'
        createdAt: {type: string, format: date-time, example: '2026-11-07T12:00:00Z'}
        version: {type: integer, format: int64, minimum: 0}
    CapsuleStatus:
      type: string
      enum: [WRITING, SEALED, OPENED]
    CapsuleCreate:
      type: object
      additionalProperties: false
      required: [title, openOn]
      properties:
        title: {type: string, minLength: 1, maxLength: 80}
        openOn: {type: string, format: date, example: '2027-11-07'}
    CapsuleSummary:
      type: object
      required: [id, title, openOn, status]
      properties:
        id: {type: string, format: uuid, example: 0192f3a4-5b6c-7d8e-9f01-23456789abcd}
        title: {type: string}
        openOn: {type: string, format: date, example: '2026-11-07'}
        status: {$ref: '#/components/schemas/CapsuleStatus'}
    Capsule:
      type: object
      description: Нээхээс өмнө хэнд ч `body` байхгүй (AC-45, GAP-15).
      required: [id, title, openOn, status, parts]
      properties:
        id: {type: string, format: uuid, example: 0192f3a4-5b6c-7d8e-9f01-23456789abcd}
        title: {type: string}
        openOn: {type: string, format: date, example: '2026-11-07'}
        status: {$ref: '#/components/schemas/CapsuleStatus'}
        parts:
          type: array
          maxItems: 2
          items:
            type: object
            required: [author, sealed]
            properties:
              author: {$ref: '#/components/schemas/UserRef'}
              sealed: {type: boolean}
              body: {type: string, description: Зөвхөн OPENED үед}
              media:
                type: array
                description: Зөвхөн OPENED үед
                items: {$ref: '#/components/schemas/MediaRef'}
    CapsulePartInput:
      type: object
      additionalProperties: false
      required: [body, mediaIds]
      properties:
        body: {type: string, maxLength: 20000}
        mediaIds:
          type: array
          maxItems: 5
          items: {type: string, format: uuid, example: 0192f3a4-5b6c-7d8e-9f01-23456789abcd}
    CheckIn:
      type: object
      required: [localDate, level, shared]
      properties:
        localDate: {type: string, format: date, example: '2026-11-07'}
        level: {type: integer, minimum: 1, maximum: 5}
        note:
          type: [string, 'null']
          maxLength: 280
        shared: {type: boolean}
    CheckInInput:
      type: object
      additionalProperties: false
      required: [level]
      properties:
        level: {type: integer, minimum: 1, maximum: 5}
        note: {type: string, maxLength: 280}
        shared: {type: boolean, description: Өгөөгүй бол `checkinAutoShare`}
    CheckInSeries:
      type: object
      required: [mine, partner]
      properties:
        mine:
          type: array
          items: {$ref: '#/components/schemas/CheckIn'}
        partner:
          type: array
          description: Зөвхөн `shared=true`
          items: {$ref: '#/components/schemas/CheckIn'}
    Stats:
      type: object
      required: [memories, photos, videos, dates, goalsCompleted, letters, daysTogether, heartsSent, cities, countries, distanceKm]
      properties:
        memories: {type: integer, minimum: 0}
        photos: {type: integer, minimum: 0}
        videos: {type: integer, minimum: 0}
        dates: {type: integer, minimum: 0}
        goalsCompleted: {type: integer, minimum: 0}
        letters: {type: integer, minimum: 0}
        daysTogether: {type: integer, minimum: 0}
        heartsSent: {type: integer, minimum: 0}
        cities: {type: integer, minimum: 0}
        countries: {type: integer, minimum: 0}
        distanceKm: {type: number, minimum: 0}
    YearInReview:
      type: object
      required: [year, totals, topMemories, slides]
      properties:
        year: {type: integer, example: 2026}
        totals:
          type: object
          description: Тухайн жилийн тоо (Stats-ийн түлхүүрүүдээр)
          additionalProperties: {type: number, minimum: 0}
        topMonth:
          oneOf:
          - type: object
            required: [month, count]
            properties:
              month: {type: integer, minimum: 1, maximum: 12}
              count: {type: integer, minimum: 0}
          - {type: 'null'}
        topPlace:
          oneOf:
          - type: object
            required: [placeName, count]
            properties:
              placeName: {type: string}
              count: {type: integer, minimum: 0}
          - {type: 'null'}
        topMemories:
          type: array
          items: {$ref: '#/components/schemas/MemorySummary'}
        slides:
          type: array
          minItems: 6
          maxItems: 10
          items: {$ref: '#/components/schemas/RecapSlide'}
    Notification:
      type: object
      required: [id, type, title, body, deepLink, createdAt]
      properties:
        id: {type: string, format: uuid, example: 0192f3a4-5b6c-7d8e-9f01-23456789abcd}
        type: {type: string, example: MEMORY_CREATED}
        title: {type: string}
        body: {type: string}
        deepLink: {type: string, example: /memories/0192f3a4-0000-7000-8000-0000000000a1}
        createdAt: {type: string, format: date-time, example: '2026-11-07T12:00:00Z'}
        readAt:
          type: [string, 'null']
          format: date-time
          example: '2026-11-07T12:00:00Z'
    NotificationPage:
      type: object
      required: [items, nextCursor, unreadCount]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Notification'}
        nextCursor:
          type: [string, 'null']
        unreadCount: {type: integer, minimum: 0}
    LocalTime: {type: string, description: 'Хэрэглэгчийн бүсийн цаг `HH:mm`', pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', example: '23:00'}
    NotificationSettings:
      type: object
      required: [disabledTypes, dndStart, dndEnd, hideContent, greetingMorning, greetingEvening, greetingMorningAt, greetingEveningAt]
      properties:
        disabledTypes:
          type: array
          uniqueItems: true
          items: {type: string, example: GREETING}
        dndStart: {$ref: '#/components/schemas/LocalTime'}
        dndEnd: {$ref: '#/components/schemas/LocalTime'}
        hideContent: {type: boolean}
        greetingMorning: {type: boolean}
        greetingEvening: {type: boolean}
        greetingMorningAt: {$ref: '#/components/schemas/LocalTime'}
        greetingEveningAt: {$ref: '#/components/schemas/LocalTime'}
    QuietModeRequest:
      type: object
      additionalProperties: false
      required: [durationMinutes]
      properties:
        durationMinutes: {type: integer, minimum: 60, maximum: 10080}
    QuietModeState:
      type: object
      required: [quietUntil]
      properties:
        quietUntil: {type: string, format: date-time, example: '2026-11-07T12:00:00Z'}
    VapidKey:
      type: object
      required: [publicKey]
      properties:
        publicKey: {type: string, description: base64url VAPID нийтийн түлхүүр}
    PushSubscriptionInput:
      type: object
      additionalProperties: false
      required: [kind, localReminders]
      properties:
        kind:
          type: string
          enum: [WEB, EXPO]
        endpoint: {type: string, format: uri, description: '`WEB` үед заавал', example: 'https://aura.example.mn/'}
        keys:
          type: object
          additionalProperties: false
          required: [p256dh, auth]
          properties:
            p256dh: {type: string}
            auth: {type: string}
        expoToken: {type: string, description: '`EXPO` үед заавал', example: 'ExponentPushToken[xxxxxxxxxxxxxxxxxxxxxx]'}
        localReminders: {type: boolean, description: Native локал сануулгатай бол серверийн сануулгын push давхардахгүй}
    IdResponse:
      type: object
      required: [id]
      properties:
        id: {type: string, format: uuid, example: 0192f3a4-5b6c-7d8e-9f01-23456789abcd}
    Reminder:
      type: object
      required: [id, sourceType, sourceId, fireAt, title, deepLink]
      properties:
        id: {type: string, format: uuid, example: 0192f3a4-5b6c-7d8e-9f01-23456789abcd}
        sourceType:
          type: string
          enum: [DATE_PLAN, ANNIVERSARY, LETTER, GREETING, INACTIVITY]
        sourceId:
          type: [string, 'null']
          format: uuid
          example: 0192f3a4-5b6c-7d8e-9f01-23456789abcd
        fireAt: {type: string, format: date-time, example: '2026-11-07T12:00:00Z'}
        title: {type: string}
        deepLink: {type: string}
    PublicKeyCredentialCreationOptions:
      type: object
      description: WebAuthn `PublicKeyCredentialCreationOptionsJSON` (webauthn4j)
      required: [challenge, rp, user, pubKeyCredParams]
      additionalProperties: true
      properties:
        challenge: {type: string, description: base64url}
        rp: {type: object, additionalProperties: true}
        user: {type: object, additionalProperties: true}
        pubKeyCredParams:
          type: array
          items: {type: object, additionalProperties: true}
        timeout: {type: integer}
    PublicKeyCredentialRequestOptions:
      type: object
      description: WebAuthn `PublicKeyCredentialRequestOptionsJSON`
      required: [challenge]
      additionalProperties: true
      properties:
        challenge: {type: string, description: base64url}
        rpId: {type: string}
        allowCredentials:
          type: array
          items: {type: object, additionalProperties: true}
        timeout: {type: integer}
    PasskeyRegistration:
      type: object
      additionalProperties: false
      required: [credential]
      properties:
        credential: {type: object, additionalProperties: true, description: WebAuthn `RegistrationResponseJSON`}
    PasskeyAssertion:
      type: object
      additionalProperties: false
      required: [credential]
      properties:
        credential: {type: object, additionalProperties: true, description: WebAuthn `AuthenticationResponseJSON`}
    PasskeyVerification:
      type: object
      required: [verified]
      properties:
        verified: {type: boolean, const: true}
    AdminMetrics:
      type: object
      description: Нэгтгэсэн тоо л — хувь хүний агуулга, ID байхгүй (AC-206).
      required: [pairingSuccessRate, firstWeek3MemoriesRate, weeklyActiveAfter30d, dailyAvg, survey]
      properties:
        pairingSuccessRate: {type: number, minimum: 0, maximum: 1}
        firstWeek3MemoriesRate: {type: number, minimum: 0, maximum: 1}
        weeklyActiveAfter30d: {type: number, minimum: 0, maximum: 1}
        dailyAvg:
          type: object
          required: [opens, messages, memories, hearts]
          properties:
            opens: {type: number, minimum: 0}
            messages: {type: number, minimum: 0}
            memories: {type: number, minimum: 0}
            hearts: {type: number, minimum: 0}
        survey:
          type: object
          required: [count, average, distribution]
          properties:
            count: {type: integer, minimum: 0}
            average:
              type: [number, 'null']
              minimum: 1
              maximum: 5
            distribution:
              type: array
              description: Оноо 1…5-ын тоо (индекс 0 = оноо 1)
              minItems: 5
              maxItems: 5
              items: {type: integer, minimum: 0}
    SuspendRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: {type: string, minLength: 1, maxLength: 500}
    TestClockRequest:
      type: object
      additionalProperties: false
      required: [now]
      properties:
        now: {type: string, format: date-time, example: '2026-11-07T15:59:00Z'}
    SeedRequest:
      type: object
      additionalProperties: false
      required: [scenario]
      properties:
        scenario: {type: string, description: 'Жишээ: COUPLE_BASIC, DASHBOARD_FULL, MEMORIES_10K, MILESTONE_1000 (жагсаалт өргөжинө)', pattern: '^[A-Z0-9_]+$',
          example: COUPLE_BASIC}
        params: {type: object, additionalProperties: true}
    SeedResult:
      type: object
      required: [users, spaceIds, ids]
      properties:
        users:
          type: array
          items:
            type: object
            required: [id, email, password]
            properties:
              id: {type: string, format: uuid, example: 0192f3a4-5b6c-7d8e-9f01-23456789abcd}
              email: {type: string, format: email, example: bat@example.mn}
              password: {type: string}
              displayName: {type: string}
        spaceIds:
          type: array
          items: {type: string, format: uuid, example: 0192f3a4-5b6c-7d8e-9f01-23456789abcd}
        ids: {type: object, description: Scenario-гийн нэрлэсэн объектын ID (жишээ `memory1`), additionalProperties: true}
    JobRunResult:
      type: object
      required: [processed]
      properties:
        processed: {type: integer, minimum: 0}
    PushSinkCreated:
      type: object
      required: [sinkId, endpoint]
      properties:
        sinkId: {type: string, format: uuid, example: 0192f3a4-5b6c-7d8e-9f01-23456789abcd}
        endpoint: {type: string, format: uri, example: 'http://localhost:8080/api/v1/test/push-sink/0192f3a4-5b6c-7d8e-9f01-23456789abcd/receive'}
    PushSinkMessage:
      type: object
      required: [receivedAt, headers, bodyBase64]
      properties:
        receivedAt: {type: string, format: date-time, example: '2026-11-07T12:00:00Z'}
        headers:
          type: object
          additionalProperties: {type: string}
        bodyBase64: {type: string, contentEncoding: base64}
    PushSinkResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: {type: integer, minimum: 200, maximum: 599, description: Дараагийн хүлээн авалтын хариу (жишээ 410), example: 410}
    TestMail:
      type: object
      required: [subject]
      properties:
        subject: {type: string}
        code:
          type: [string, 'null']
          pattern: ^[0-9]{6}$
          example: '482913'
        link:
          type: [string, 'null']
          format: uri
          example: https://aura.example.mn/
