# Aura API — REST гэрээ (OpenAPI 3.1). Backend ба mobile-ийн төрлийн нэг эх.
# Эх: LAB-2 нарийвчилсан загвар §4.1 ба DD-AURA-006/012/013/016/028. Засвар бүрийг загвартай тулга.
openapi: 3.1.0
info:
  title: Aura API
  version: 1.0.0
  description: |
    Aura хосын апп-ын REST гэрээ (LAB-2). Backend-ийн controller ба mobile-ийн төрөл энэ файлаас үүснэ.
    Operation бүр `x-aura-scope` (public|user|space|admin|test) ба `x-aura-ac` (AC ID) тэмдэгтэй;
    `x-aura-requires-couple: true` нь SOLO үед 409 `NOT_PAIRED` буцаана.
servers:
- {url: /api/v1}
security:
- bearerAuth: []
tags:
- {name: Auth, description: 'Бүртгэл, баталгаажуулалт, нэвтрэлт, токен, OAuth, нууц үг'}
- {name: Policies, description: Нууцлалын бодлого ба үйлчилгээний нөхцөл}
- {name: System, description: Апп-ын хувилбар}
- {name: Me, description: 'Профайл, тохиргоо, эхний 7 хоног, баяр, санал асуулга'}
- {name: Sessions, description: Нэвтэрсэн төхөөрөмжүүд}
- {name: Geo, description: Хот хайлт}
- {name: Invites, description: Урилга ба хос холболт}
- {name: Couple, description: 'Хосын орон зай, эхэлсэн өдөр, сэдэв, салалт'}
- {name: Dashboard, description: Нүүрний нэгтгэл}
- {name: Questions, description: Өдрийн асуулт}
- {name: Signals, description: 'Зүрх, тэврэлт, «чамайг бодож байна»'}
- {name: Weather, description: Цаг агаар (Open-Meteo)}
- {name: Uploads, description: Хэсэгчилсэн (chunk) upload}
- {name: Media, description: Медиа ба хадгалах сан}
- {name: Memories, description: 'Дурсамж, сэтгэгдэл, реакц, хогийн сав'}
- {name: MemoryGroups, description: Дурсамжийн бүлэг}
- {name: Recaps, description: Жилийн тойм}
- {name: Exports, description: 'Өгөгдөл, PDF ном, ZIP цомгийн экспорт'}
- {name: Chat, description: Чат}
- {name: Promises, description: Хамтын амлалт}
- {name: Ideas, description: Болзооны санаа ба сан}
- {name: Plans, description: 'Болзоо, checklist, ICS'}
- {name: Budget, description: Зардал ба төсөв}
- {name: Deck, description: Нууц deck}
- {name: Anniversaries, description: Ой ба автомат ой}
- {name: GiftIdeas, description: Нууц бэлгийн санаа}
- {name: Lists, description: Хамтын жагсаалт}
- {name: Goals, description: Хамтын зорилго}
- {name: Letters, description: Захидал}
- {name: Capsules, description: Цагийн капсул}
- {name: CheckIns, description: Сэтгэл санааны check-in}
- {name: Stats, description: Статистик ба «Бидний жил»}
- {name: Notifications, description: Апп доторх мэдэгдэл ба тохиргоо}
- {name: Push, description: Push subscription}
- {name: Reminders, description: Хуваарьт сануулга}
- {name: Passkeys, description: WebAuthn passkey}
- {name: Admin, description: Админ}
- {name: TestSupport, description: '`e2e` profile-д л — prod-д 404 (INV-10)'}
paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Бүртгүүлэх
      operationId: registerUser
      x-aura-scope: public
      x-aura-ac: [AC-02, AC-04, AC-63, AC-164]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterRequest'}
      responses:
        '202':
          description: Бүртгэлтэй эсэхээс үл хамааран ижил хариу
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AcceptedResponse'}
        '400':
          $ref: '#/components/responses/BadRequest'
          description: 'Алдааны код: `PASSWORD_WEAK` · `PASSWORD_COMMON` · `AGE_RESTRICTED` · `POLICY_NOT_ACCEPTED` · `VALIDATION_FAILED`'
  /auth/verify-email:
    post:
      tags: [Auth]
      summary: Имэйлийг кодоор баталгаажуулах
      operationId: verifyEmail
      x-aura-scope: public
      x-aura-ac: [AC-01, AC-165]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/VerifyEmailRequest'}
      responses:
        '200':
          description: Амжилттай
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TokenResponse'}
        '400':
          $ref: '#/components/responses/BadRequest'
          description: 'Алдааны код: `CODE_INVALID` (+details.attemptsLeft) · `VALIDATION_FAILED`'
        '410':
          $ref: '#/components/responses/Gone'
          description: 'Алдааны код: `CODE_EXPIRED`'
        '423':
          $ref: '#/components/responses/Locked'
          description: 'Алдааны код: `CODE_LOCKED` (+retryAfterSeconds)'
  /auth/verify-email/link:
    post:
      tags: [Auth]
      summary: Имэйлийг холбоосоор баталгаажуулах
      operationId: verifyEmailLink
      x-aura-scope: public
      x-aura-ac: [AC-165]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TokenRequest'}
      responses:
        '200':
          description: Амжилттай
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TokenResponse'}
        '400':
          $ref: '#/components/responses/BadRequest'
          description: 'Алдааны код: `TOKEN_INVALID` · `VALIDATION_FAILED`'
        '410':
          $ref: '#/components/responses/Gone'
          description: 'Алдааны код: `TOKEN_EXPIRED`'
  /auth/verify-email/resend:
    post:
      tags: [Auth]
      summary: Баталгаажуулах код дахин илгээх
      operationId: resendVerificationEmail
      x-aura-scope: public
      x-aura-ac: [AC-01]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EmailRequest'}
      responses:
        '202': {description: Хүлээн авлаа}
        '400':
          $ref: '#/components/responses/BadRequest'
          description: 'Алдааны код: `VALIDATION_FAILED`'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: 'Алдааны код: `RATE_LIMITED` (60 с)'
  /auth/login:
    post:
      tags: [Auth]
      summary: Нэвтрэх
      operationId: login
      x-aura-scope: public
      x-aura-ac: [AC-05, AC-195]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200':
          description: 'Нэвтэрлээ. Native-д `refreshToken` биед; web-д зөвхөн `Set-Cookie: aura_rt`'
          headers:
            Set-Cookie:
              description: '`aura_rt=…; HttpOnly; SameSite=Strict; Path=/api/v1/auth` (prod-д `Secure`) — зөвхөн web client-д'
              schema: {type: string, example: aura_rt=q8F2…; HttpOnly; SameSite=Strict; Path=/api/v1/auth; Secure}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TokenResponse'}
        '400':
          $ref: '#/components/responses/BadRequest'
          description: 'Алдааны код: `VALIDATION_FAILED`'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: 'Алдааны код: `AUTH_INVALID_CREDENTIALS`'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: 'Алдааны код: `AUTH_EMAIL_NOT_VERIFIED`'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: 'Алдааны код: `RATE_LIMITED` (+Retry-After)'
  /auth/refresh:
    post:
      tags: [Auth]
      summary: Токен шинэчлэх (rotation)
      description: 'Refresh-ийг native нь биед (`refreshToken`), web нь `aura_rt` cookie + `X-Aura-Client: web` header-ээр илгээнэ (DD-AURA-006).'
      operationId: refreshToken
      x-aura-scope: public
      x-aura-ac: [AC-03, AC-07, AC-168]
      security: []
      parameters:
      - name: X-Aura-Client
        in: header
        required: false
        schema:
          type: string
          enum: [web]
        description: Web client cookie-оор шинэчлэхэд заавал (CSRF хамгаалалт)
      - name: aura_rt
        in: cookie
        required: false
        schema: {type: string}
        description: Web-ийн refresh токен (HttpOnly)
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RefreshRequest'}
      responses:
        '200':
          description: Шинэ access ба refresh (rotation)
          headers:
            Set-Cookie:
              description: '`aura_rt=…; HttpOnly; SameSite=Strict; Path=/api/v1/auth` (prod-д `Secure`) — зөвхөн web client-д'
              schema: {type: string, example: aura_rt=q8F2…; HttpOnly; SameSite=Strict; Path=/api/v1/auth; Secure}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TokenResponse'}
        '400':
          $ref: '#/components/responses/BadRequest'
          description: 'Алдааны код: `VALIDATION_FAILED`'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: 'Алдааны код: `AUTH_SESSION_REVOKED` (дахин ашиглалт → бүх session хаагдсан) · `TOKEN_INVALID` · `TOKEN_EXPIRED`'
  /auth/logout:
    post:
      tags: [Auth]
      summary: Гарах
      operationId: logout
      x-aura-scope: user
      x-aura-ac: [AC-56]
      responses:
        '204':
          description: Session хаагдаж cookie цэвэрлэгдэнэ
          headers:
            Set-Cookie:
              description: '`aura_rt` cookie-г цэвэрлэнэ (Max-Age=0)'
              schema: {type: string}
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: 'Алдааны код: `TOKEN_INVALID` · `TOKEN_EXPIRED`'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: 'Алдааны код: `ACCOUNT_SUSPENDED`'
  /auth/password-reset/request:
    post:
      tags: [Auth]
      summary: Нууц үг сэргээх холбоос хүсэх
      operationId: requestPasswordReset
      x-aura-scope: public
      x-aura-ac: [AC-166]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EmailRequest'}
      responses:
        '202': {description: Бүртгэлтэй эсэхээс үл хамааран ижил хариу}
        '400':
          $ref: '#/components/responses/BadRequest'
          description: 'Алдааны код: `VALIDATION_FAILED`'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: 'Алдааны код: `RATE_LIMITED`'
  /auth/password-reset/confirm:
    post:
      tags: [Auth]
      summary: Шинэ нууц үг тогтоох
      operationId: confirmPasswordReset
      x-aura-scope: public
      x-aura-ac: [AC-03, AC-166]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PasswordResetConfirm'}
      responses:
        '204': {description: Нууц үг солигдож бүх session хаагдлаа}
        '400':
          $ref: '#/components/responses/BadRequest'
          description: 'Алдааны код: `TOKEN_INVALID` · `PASSWORD_WEAK` · `PASSWORD_COMMON` · `VALIDATION_FAILED`'
        '410':
          $ref: '#/components/responses/Gone'
          description: 'Алдааны код: `TOKEN_EXPIRED`'
  /auth/not-me:
    post:
      tags: [Auth]
      summary: «Би биш» — бүх session хаах
      operationId: reportNotMe
      x-aura-scope: public
      x-aura-ac: [AC-125, AC-187]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TokenRequest'}
      responses:
        '204': {description: 'Бүх session revoke, дараагийн нэвтрэлтэд нууц үг шаардана'}
        '400':
          $ref: '#/components/responses/BadRequest'
          description: 'Алдааны код: `TOKEN_INVALID` · `VALIDATION_FAILED`'
        '410':
          $ref: '#/components/responses/Gone'
          description: 'Алдааны код: `TOKEN_EXPIRED`'
  /auth/oauth/{provider}/start:
    parameters:
    - {$ref: '#/components/parameters/provider'}
    get:
      tags: [Auth]
      summary: OAuth эхлүүлэх
      operationId: startOAuth
      x-aura-scope: public
      x-aura-ac: [AC-06]
      security: []
      parameters:
      - name: client
        in: query
        required: true
        schema:
          type: string
          enum: [web, native]
      responses:
        '302':
          description: IdP-ийн нэвтрэх хуудас руу
          headers:
            Location:
              description: Чиглүүлэх URL
              schema: {type: string, format: uri, example: 'https://accounts.google.com/o/oauth2/v2/auth?client_id=x'}
        '404':
          $ref: '#/components/responses/NotFound'
          description: 'Алдааны код: `PROVIDER_DISABLED`'
  /auth/oauth/{provider}/callback:
    parameters:
    - {$ref: '#/components/parameters/provider'}
    get:
      tags: [Auth]
      summary: OAuth callback
      operationId: oauthCallback
      x-aura-scope: public
      x-aura-ac: [AC-06]
      security: []
      parameters:
      - name: code
        in: query
        required: false
        schema: {type: string}
      - name: state
        in: query
        required: true
        schema: {type: string}
      - name: error
        in: query
        required: false
        schema: {type: string}
        description: IdP-ийн алдаа
      responses:
        '302':
          description: 'Web: `/oauth-callback?code=…`, native: `aura://oauth-callback?code=…`; алдаатай бол `?error=…`'
          headers:
            Location:
              description: Чиглүүлэх URL
              schema: {type: string, format: uri, example: 'https://accounts.google.com/o/oauth2/v2/auth?client_id=x'}
  /auth/oauth/exchange:
    post:
      tags: [Auth]
      summary: OAuth кодыг токеноор солих
      operationId: exchangeOAuthCode
      x-aura-scope: public
      x-aura-ac: [AC-06, AC-167]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OAuthExchangeRequest'}
      responses:
        '200':
          description: Амжилттай
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OAuthExchangeResponse'}
        '400':
          $ref: '#/components/responses/BadRequest'
          description: 'Алдааны код: `CODE_INVALID` · `VALIDATION_FAILED`'
        '410':
          $ref: '#/components/responses/Gone'
          description: 'Алдааны код: `CODE_EXPIRED`'
  /auth/oauth/link:
    post:
      tags: [Auth]
      summary: OAuth-ийг байгаа акаунттай холбох
      operationId: linkOAuthAccount
      x-aura-scope: public
      x-aura-ac: [AC-167]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OAuthLinkRequest'}
      responses:
        '200':
          description: Амжилттай
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TokenResponse'}
        '400':
          $ref: '#/components/responses/BadRequest'
          description: 'Алдааны код: `VALIDATION_FAILED`'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: 'Алдааны код: `AUTH_INVALID_CREDENTIALS`'
        '410':
          $ref: '#/components/responses/Gone'
          description: 'Алдааны код: `TOKEN_EXPIRED`'
  /policies/current:
    get:
      tags: [Policies]
      summary: Одоогийн нууцлал ба үйлчилгээний нөхцөл
      operationId: getCurrentPolicy
      x-aura-scope: public
      x-aura-ac: [AC-63, AC-130]
      security: []
      parameters:
      - name: locale
        in: query
        required: false
        schema: {$ref: '#/components/schemas/Locale'}
      responses:
        '200':
          description: Амжилттай
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PolicyDocument'}
  /version:
    get:
      tags: [System]
      summary: Апп-ын хувилбарын мэдээлэл
      operationId: getVersion
      x-aura-scope: public
      x-aura-ac: [AC-141]
      security: []
      parameters:
      - name: platform
        in: query
        required: false
        schema:
          type: string
          enum: [web, android, ios]
      - name: current
        in: query
        required: false
        schema: {type: string, pattern: '^[0-9]+\.[0-9]+\.[0-9]+$', example: 1.0.0}
        description: Client-ийн одоогийн хувилбар
      responses:
        '200':
          description: Амжилттай
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VersionInfo'}
  /me:
    get:
      tags: [Me]
      summary: Миний профайл
      operationId: getMe
      x-aura-scope: user
      x-aura-ac: [AC-63, AC-64]
      responses:
        '200':
          description: Амжилттай
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Me'}
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: 'Алдааны код: `TOKEN_INVALID` · `TOKEN_EXPIRED`'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: 'Алдааны код: `ACCOUNT_SUSPENDED`'
    patch:
      tags: [Me]
      summary: Профайл засах
      operationId: updateMe
      x-aura-scope: user
      x-aura-ac: [AC-62, AC-64, AC-70, AC-177]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProfileUpdate'}
      responses:
        '200':
          description: Хамтрагчид WS `profile.updated`
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Me'}
        '400':
          $ref: '#/components/responses/BadRequest'
          description: 'Алдааны код: `AGE_RESTRICTED` · `VALIDATION_FAILED`'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: 'Алдааны код: `TOKEN_INVALID` · `TOKEN_EXPIRED`'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: 'Алдааны код: `ACCOUNT_SUSPENDED`'
        '409':
          $ref: '#/components/responses/Conflict'
          description: 'Алдааны код: `VERSION_CONFLICT`'
  /me/avatar:
    put:
      tags: [Me]
      summary: Профайл зураг солих
      operationId: setAvatar
      x-aura-scope: user
      x-aura-ac: [AC-62]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AvatarRequest'}
      responses:
        '200':
          description: Амжилттай
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Me'}
        '400':
          $ref: '#/components/responses/BadRequest'
          description: 'Алдааны код: `VALIDATION_FAILED`'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: 'Алдааны код: `TOKEN_INVALID` · `TOKEN_EXPIRED`'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: 'Алдааны код: `ACCOUNT_SUSPENDED`'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
          description: 'Алдааны код: `MEDIA_TOO_LARGE` (≤ 10 MB)'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
          description: 'Алдааны код: `MEDIA_TYPE_FORBIDDEN`'
  /me/preferences:
    get:
      tags: [Me]
      summary: Тохиргоо авах
      operationId: getPreferences
      x-aura-scope: user
      x-aura-ac: [AC-183, AC-190, AC-217, AC-139]
      responses:
        '200':
          description: Амжилттай
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Preferences'}
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: 'Алдааны код: `TOKEN_INVALID` · `TOKEN_EXPIRED`'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: 'Алдааны код: `ACCOUNT_SUSPENDED`'
    patch:
      tags: [Me]
      summary: Тохиргоо засах
      operationId: updatePreferences
      x-aura-scope: user
      x-aura-ac: [AC-183, AC-190, AC-217, AC-139]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PreferencesUpdate'}
      responses:
        '200':
          description: Амжилттай
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Preferences'}
        '400':
          $ref: '#/components/responses/BadRequest'
          description: 'Алдааны код: `VALIDATION_FAILED`'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: 'Алдааны код: `TOKEN_INVALID` · `TOKEN_EXPIRED`'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: 'Алдааны код: `ACCOUNT_SUSPENDED`'
  /me/policy-acceptance:
    post:
      tags: [Me]
      summary: Шинэ бодлогыг зөвшөөрөх
      operationId: acceptPolicy
      x-aura-scope: user
      x-aura-ac: [AC-63]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PolicyAcceptance'}
      responses:
        '204': {description: Агуулгагүй амжилт}
        '400':
          $ref: '#/components/responses/BadRequest'
          description: 'Алдааны код: `POLICY_NOT_ACCEPTED` · `VALIDATION_FAILED`'
        '401':
          $ref: '#/components/responses/Unauthorized'
