          maxItems: 5
          items: {$ref: '#/components/schemas/MemorySummary'}
        unreadMessages: {type: integer, minimum: 0}
        onThisDay:
          oneOf:
          - {$ref: '#/components/schemas/OnThisDaySummary'}
          - {type: 'null'}
        recap:
          oneOf:
          - {$ref: '#/components/schemas/RecapSummary'}
          - {type: 'null'}
        incomingLetters:
          type: array
          items: {$ref: '#/components/schemas/LetterTeaser'}
        survey:
          oneOf:
          - {$ref: '#/components/schemas/SurveyPrompt'}
          - {type: 'null'}
        update:
          oneOf:
          - {$ref: '#/components/schemas/VersionInfo'}
          - {type: 'null'}
