asyncapi: 3.0.0
info:
  title: Aura Realtime
  version: 1.0.0
  description: Aura-гийн бодит цагийн гэрээ (STOMP 1.2 over WebSocket). Сервер үйл явдлыг хэрэглэгч тутмын `/user/queue/events`
    руу л илгээнэ (DD-AURA-008); хосын хуваалцсан topic байхгүй. Энэ баримтын application нь mobile client. HTTP
    гэрээ — `contracts/openapi.yaml`.
defaultContentType: application/json
servers:
  dev:
    host: localhost:8080
    protocol: ws
    pathname: /ws
    description: 'DEV compose; CONNECT header `Authorization: Bearer <access>`'
    security:
    - $ref: '#/components/securitySchemes/bearerAuth'
  prod:
    host: '{duckdnsHost}'
    protocol: wss
    pathname: /ws
    variables:
      duckdnsHost:
        default: aura.duckdns.org
        description: PAR — эзний DuckDNS хаяг
    security:
    - $ref: '#/components/securitySchemes/bearerAuth'
channels:
  userEvents:
    address: /user/queue/events
    title: Хэрэглэгч тутмын үйл явдал
    description: Envelope `{id, type, occurredAt, actorId, payload}`. Өөр destination-д SUBSCRIBE → ERROR frame
      (AC-31).
    messages:
      signalReceived:
        $ref: '#/components/messages/SignalReceived'
      chatMessageCreated:
        $ref: '#/components/messages/ChatMessageCreated'
      chatMessageUpdated:
        $ref: '#/components/messages/ChatMessageUpdated'
      chatMessageDeleted:
        $ref: '#/components/messages/ChatMessageDeleted'
      chatExpired:
        $ref: '#/components/messages/ChatExpired'
      chatReceipt:
        $ref: '#/components/messages/ChatReceipt'
      chatTyping:
        $ref: '#/components/messages/ChatTyping'
      chatPinned:
        $ref: '#/components/messages/ChatPinned'
      chatReaction:
        $ref: '#/components/messages/ChatReaction'
      presenceChanged:
        $ref: '#/components/messages/PresenceChanged'
      profileUpdated:
        $ref: '#/components/messages/ProfileUpdated'
      coupleUpdated:
        $ref: '#/components/messages/CoupleUpdated'
      coupleLinked:
        $ref: '#/components/messages/CoupleLinked'
      pairingRequested:
        $ref: '#/components/messages/PairingRequested'
      pairingCancelled:
        $ref: '#/components/messages/PairingCancelled'
      memoryCreated:
        $ref: '#/components/messages/MemoryCreated'
      memoryUpdated:
        $ref: '#/components/messages/MemoryUpdated'
      memoryDeleted:
        $ref: '#/components/messages/MemoryDeleted'
      memoryComment:
        $ref: '#/components/messages/MemoryComment'
      memoryReaction:
        $ref: '#/components/messages/MemoryReaction'
      planUpdated:
        $ref: '#/components/messages/PlanUpdated'
      checklistUpdated:
        $ref: '#/components/messages/ChecklistUpdated'
      deckMatched:
        $ref: '#/components/messages/DeckMatched'
      listUpdated:
        $ref: '#/components/messages/ListUpdated'
      goalUpdated:
        $ref: '#/components/messages/GoalUpdated'
      letterDelivered:
        $ref: '#/components/messages/LetterDelivered'
      letterRead:
        $ref: '#/components/messages/LetterRead'
      capsuleOpened:
        $ref: '#/components/messages/CapsuleOpened'
      questionRevealed:
        $ref: '#/components/messages/QuestionRevealed'
      checkinShared:
        $ref: '#/components/messages/CheckinShared'
      notificationCreated:
        $ref: '#/components/messages/NotificationCreated'
      promiseUpdated:
        $ref: '#/components/messages/PromiseUpdated'
      quietChanged:
        $ref: '#/components/messages/QuietChanged'
      sessionRevoked:
        $ref: '#/components/messages/SessionRevoked'
  typing:
    address: /app/typing
    messages:
      typingSignal:
        $ref: '#/components/messages/TypingSignal'
  presence:
    address: /app/presence
    messages:
      presencePing:
        $ref: '#/components/messages/PresencePing'
  chatDelivered:
    address: /app/chat.delivered
    messages:
      deliveredAck:
        $ref: '#/components/messages/DeliveredAck'
operations:
  receiveUserEvents:
    action: receive
    channel:
      $ref: '#/channels/userEvents'
    summary: Хамтрагчийн үйлдэл, хүргэлт, мэдэгдлийг хүлээн авах
    messages:
    - $ref: '#/channels/userEvents/messages/signalReceived'
    - $ref: '#/channels/userEvents/messages/chatMessageCreated'
    - $ref: '#/channels/userEvents/messages/chatMessageUpdated'
    - $ref: '#/channels/userEvents/messages/chatMessageDeleted'
    - $ref: '#/channels/userEvents/messages/chatExpired'
    - $ref: '#/channels/userEvents/messages/chatReceipt'
    - $ref: '#/channels/userEvents/messages/chatTyping'
    - $ref: '#/channels/userEvents/messages/chatPinned'
    - $ref: '#/channels/userEvents/messages/chatReaction'
    - $ref: '#/channels/userEvents/messages/presenceChanged'
    - $ref: '#/channels/userEvents/messages/profileUpdated'
    - $ref: '#/channels/userEvents/messages/coupleUpdated'
    - $ref: '#/channels/userEvents/messages/coupleLinked'
    - $ref: '#/channels/userEvents/messages/pairingRequested'
    - $ref: '#/channels/userEvents/messages/pairingCancelled'
    - $ref: '#/channels/userEvents/messages/memoryCreated'
    - $ref: '#/channels/userEvents/messages/memoryUpdated'
    - $ref: '#/channels/userEvents/messages/memoryDeleted'
    - $ref: '#/channels/userEvents/messages/memoryComment'
    - $ref: '#/channels/userEvents/messages/memoryReaction'
    - $ref: '#/channels/userEvents/messages/planUpdated'
    - $ref: '#/channels/userEvents/messages/checklistUpdated'
    - $ref: '#/channels/userEvents/messages/deckMatched'
    - $ref: '#/channels/userEvents/messages/listUpdated'
    - $ref: '#/channels/userEvents/messages/goalUpdated'
    - $ref: '#/channels/userEvents/messages/letterDelivered'
    - $ref: '#/channels/userEvents/messages/letterRead'
    - $ref: '#/channels/userEvents/messages/capsuleOpened'
    - $ref: '#/channels/userEvents/messages/questionRevealed'
    - $ref: '#/channels/userEvents/messages/checkinShared'
    - $ref: '#/channels/userEvents/messages/notificationCreated'
    - $ref: '#/channels/userEvents/messages/promiseUpdated'
    - $ref: '#/channels/userEvents/messages/quietChanged'
    - $ref: '#/channels/userEvents/messages/sessionRevoked'
  sendTyping:
    action: send
    channel:
      $ref: '#/channels/typing'
    summary: Бичиж байгаа төлөв (typing_visible хоёулаа true үед л дамжина)
    messages:
    - $ref: '#/channels/typing/messages/typingSignal'
  sendPresence:
    action: send
    channel:
      $ref: '#/channels/presence'
    summary: Апп урд/ард (online_visible хоёулаа true үед л дамжина)
    messages:
    - $ref: '#/channels/presence/messages/presencePing'
  sendChatDelivered:
    action: send
    channel:
      $ref: '#/channels/chatDelivered'
    summary: Мессеж төхөөрөмжид хүрсэн
    messages:
    - $ref: '#/channels/chatDelivered/messages/deliveredAck'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  messages:
    SignalReceived:
      name: signal.received
      title: Зүрх / тэврэлт / «Чамайг бодож байна» ирлээ
      contentType: application/json
      payload:
        $ref: '#/components/schemas/SignalReceivedEvent'
      x-aura-ac:
      - AC-17
      - AC-76
      - AC-77
    ChatMessageCreated:
      name: chat.message.created
      title: Шинэ мессеж
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ChatMessageCreatedEvent'
      x-aura-ac:
      - AC-27
      - AC-28
    ChatMessageUpdated:
      name: chat.message.updated
      title: Мессеж засагдсан
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ChatMessageUpdatedEvent'
      x-aura-ac:
      - AC-88
    ChatMessageDeleted:
      name: chat.message.deleted
      title: Мессеж устгагдсан
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ChatMessageDeletedEvent'
      x-aura-ac:
      - AC-176
      - AC-30
    ChatExpired:
      name: chat.expired
      title: Алга болдог мессежийн хугацаа дууссан
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ChatExpiredEvent'
      x-aura-ac:
      - AC-92
    ChatReceipt:
      name: chat.receipt
      title: Хүргэгдсэн / уншсан
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ChatReceiptEvent'
      x-aura-ac:
      - AC-29
      - AC-176
    ChatTyping:
      name: chat.typing
      title: Хамтрагч бичиж байна
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ChatTypingEvent'
      x-aura-ac:
      - AC-177
    ChatPinned:
      name: chat.pinned
      title: Pin өөрчлөгдсөн
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ChatPinnedEvent'
      x-aura-ac:
      - AC-90
    ChatReaction:
      name: chat.reaction
      title: Мессежийн реакц
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ChatReactionEvent'
      x-aura-ac:
      - AC-88
    PresenceChanged:
      name: presence.changed
      title: Хамтрагчийн онлайн төлөв
      contentType: application/json
      payload:
        $ref: '#/components/schemas/PresenceChangedEvent'
      x-aura-ac:
      - AC-70
    ProfileUpdated:
      name: profile.updated
      title: Хамтрагчийн профайл өөрчлөгдсөн
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ProfileUpdatedEvent'
      x-aura-ac:
      - AC-62
    CoupleUpdated:
      name: couple.updated
      title: Хосын төлөв (эхэлсэн өдөр, сэдэв, тасалалт)
      contentType: application/json
      payload:
        $ref: '#/components/schemas/CoupleUpdatedEvent'
      x-aura-ac:
      - AC-65
      - AC-138
      - AC-185
    CoupleLinked:
      name: couple.linked
      title: Хос холбогдлоо
      contentType: application/json
      payload:
        $ref: '#/components/schemas/CoupleLinkedEvent'
      x-aura-ac:
      - AC-11
    PairingRequested:
      name: pairing.requested
      title: Урилгыг ашиглаж нэгдэх хүсэлт
      contentType: application/json
      payload:
        $ref: '#/components/schemas/PairingRequestedEvent'
      x-aura-ac:
      - AC-68
      - AC-170
    PairingCancelled:
      name: pairing.cancelled
      title: Нэгдэх хүсэлт цуцлагдсан
      contentType: application/json
      payload:
        $ref: '#/components/schemas/PairingCancelledEvent'
      x-aura-ac:
      - AC-10
    MemoryCreated:
      name: memory.created
      title: Дурсамж нэмэгдсэн
      contentType: application/json
      payload:
        $ref: '#/components/schemas/MemoryCreatedEvent'
      x-aura-ac:
      - AC-20
    MemoryUpdated:
      name: memory.updated
      title: Дурсамж өөрчлөгдсөн
      contentType: application/json
      payload:
        $ref: '#/components/schemas/MemoryUpdatedEvent'
      x-aura-ac:
      - AC-131
    MemoryDeleted:
      name: memory.deleted
      title: Дурсамж хогийн саванд
      contentType: application/json
      payload:
        $ref: '#/components/schemas/MemoryDeletedEvent'
      x-aura-ac:
      - AC-174
    MemoryComment:
      name: memory.comment
      title: Дурсамжийн сэтгэгдэл
      contentType: application/json
      payload:
        $ref: '#/components/schemas/MemoryCommentEvent'
      x-aura-ac:
      - AC-173
    MemoryReaction:
      name: memory.reaction
      title: Дурсамжийн реакц
      contentType: application/json
      payload:
        $ref: '#/components/schemas/MemoryReactionEvent'
      x-aura-ac:
      - AC-173
    PlanUpdated:
      name: plan.updated
      title: Болзооны төлөв өөрчлөгдсөн
      contentType: application/json
      payload:
        $ref: '#/components/schemas/PlanUpdatedEvent'
      x-aura-ac:
      - AC-33
    ChecklistUpdated:
      name: checklist.updated
      title: Бэлтгэлийн checklist
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ChecklistUpdatedEvent'
      x-aura-ac:
      - AC-96
    DeckMatched:
      name: deck.matched
      title: Нууц санал нэгдэлд тохирол
      contentType: application/json
      payload:
        $ref: '#/components/schemas/DeckMatchedEvent'
      x-aura-ac:
      - AC-36
    ListUpdated:
      name: list.updated
      title: Жагсаалтын зүйл
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ListUpdatedEvent'
      x-aura-ac:
      - AC-107
      - AC-109
    GoalUpdated:
      name: goal.updated
      title: Зорилгын явц
      contentType: application/json
      payload:
        $ref: '#/components/schemas/GoalUpdatedEvent'
      x-aura-ac:
      - AC-42
    LetterDelivered:
      name: letter.delivered
      title: Захидал хүргэгдсэн
      contentType: application/json
      payload:
        $ref: '#/components/schemas/LetterDeliveredEvent'
      x-aura-ac:
      - AC-44
      - AC-182
    LetterRead:
      name: letter.read
      title: Захидлыг уншсан
      contentType: application/json
      payload:
        $ref: '#/components/schemas/LetterReadEvent'
      x-aura-ac:
      - AC-182
    CapsuleOpened:
      name: capsule.opened
      title: Time capsule нээгдсэн
      contentType: application/json
      payload:
        $ref: '#/components/schemas/CapsuleOpenedEvent'
      x-aura-ac:
      - AC-45
    QuestionRevealed:
      name: question.revealed
      title: Хоёулаа хариулсан — хариулт нээгдлээ
      contentType: application/json
      payload:
        $ref: '#/components/schemas/QuestionRevealedEvent'
      x-aura-ac:
      - AC-15
    CheckinShared:
      name: checkin.shared
      title: Хамтрагч check-in хуваалцсан
      contentType: application/json
      payload:
        $ref: '#/components/schemas/CheckinSharedEvent'
      x-aura-ac:
      - AC-115
    NotificationCreated:
      name: notification.created
      title: Апп доторх мэдэгдэл
      contentType: application/json
      payload:
        $ref: '#/components/schemas/NotificationCreatedEvent'
      x-aura-ac:
      - AC-120
    PromiseUpdated:
      name: promise.updated
      title: Амлалтын төлөв
      contentType: application/json
      payload:
        $ref: '#/components/schemas/PromiseUpdatedEvent'
      x-aura-ac:
      - AC-93
    QuietChanged:
      name: quiet.changed
      title: Хамтрагчийн «Түр тайван байх» төлөв
      contentType: application/json
      payload:
        $ref: '#/components/schemas/QuietChangedEvent'
      x-aura-ac:
      - AC-123
    SessionRevoked:
      name: session.revoked
      title: Энэ төхөөрөмжийн session хаагдсан
      contentType: application/json
      payload:
        $ref: '#/components/schemas/SessionRevokedEvent'
      x-aura-ac:
      - AC-56
    TypingSignal:
      name: typing
      title: Бичиж байна
      contentType: application/json
      payload:
        $ref: '#/components/schemas/TypingSignal'
      x-aura-ac:
      - AC-177
    PresencePing:
      name: presence
      title: Апп урд/ард
      contentType: application/json
      payload:
        $ref: '#/components/schemas/PresencePing'
      x-aura-ac:
      - AC-70
    DeliveredAck:
      name: chat.delivered
      title: Мессеж хүргэгдсэн
      contentType: application/json
      payload:
        $ref: '#/components/schemas/DeliveredAck'
      x-aura-ac:
      - AC-176
  schemas:
    SignalReceivedEvent:
      type: object
      required:
      - id
      - type
      - occurredAt
      - payload
      properties:
        id:
          type: string
          format: uuid
          examples:
          - 0190f4d2-7c1e-7a3b-9e21-5b8c2d4e6f10
        type:
          type: string
          const: signal.received
        occurredAt:
          type: string
          format: date-time
          examples:
          - '2026-11-07T11:30:00Z'
        actorId:
          type:
          - string
          - 'null'
          format: uuid
        payload:
          type: object
          properties:
            signalId:
              type: string
              format: uuid
              examples:
              - 0190f4d2-7c1e-7a3b-9e21-5b8c2d4e6f10
            kind:
              type: string
              enum:
              - HEART
              - HUG
              - THINKING
            text:
              type:
              - string
              - 'null'
              maxLength: 80
          required:
          - signalId
          - kind
    ChatMessageCreatedEvent:
      type: object
      required:
      - id
      - type
      - occurredAt
      - payload
      properties:
        id:
          type: string
          format: uuid
          examples:
          - 0190f4d2-7c1e-7a3b-9e21-5b8c2d4e6f10
        type:
          type: string
          const: chat.message.created
        occurredAt:
          type: string
          format: date-time
          examples:
          - '2026-11-07T11:30:00Z'
        actorId:
          type:
          - string
          - 'null'
          format: uuid
        payload:
          $ref: '#/components/schemas/Message'
    ChatMessageUpdatedEvent:
      type: object
      required:
      - id
      - type
      - occurredAt
      - payload
      properties:
        id:
          type: string
          format: uuid
          examples:
          - 0190f4d2-7c1e-7a3b-9e21-5b8c2d4e6f10
        type:
          type: string
          const: chat.message.updated
        occurredAt:
          type: string
          format: date-time
          examples:
          - '2026-11-07T11:30:00Z'
        actorId:
          type:
          - string
          - 'null'
          format: uuid
        payload:
          $ref: '#/components/schemas/Message'
    ChatMessageDeletedEvent:
      type: object
      required:
      - id
      - type
      - occurredAt
      - payload
      properties:
        id:
          type: string
          format: uuid
          examples:
          - 0190f4d2-7c1e-7a3b-9e21-5b8c2d4e6f10
        type:
          type: string
          const: chat.message.deleted
        occurredAt:
          type: string
          format: date-time
          examples:
          - '2026-11-07T11:30:00Z'
        actorId:
          type:
          - string
          - 'null'
          format: uuid
        payload:
          type: object
          properties:
            messageId:
              type: string
              format: uuid
              examples:
              - 0190f4d2-7c1e-7a3b-9e21-5b8c2d4e6f10
          required:
          - messageId
    ChatExpiredEvent:
      type: object
      required:
      - id
      - type
      - occurredAt
      - payload
      properties:
        id:
          type: string
          format: uuid
          examples:
          - 0190f4d2-7c1e-7a3b-9e21-5b8c2d4e6f10
        type:
          type: string
          const: chat.expired
        occurredAt:
          type: string
          format: date-time
          examples:
          - '2026-11-07T11:30:00Z'
        actorId:
          type:
          - string
          - 'null'
          format: uuid
        payload:
          type: object
          properties:
            messageId:
              type: string
              format: uuid
              examples:
              - 0190f4d2-7c1e-7a3b-9e21-5b8c2d4e6f10
          required:
          - messageId
    ChatReceiptEvent:
      type: object
      required:
      - id
      - type
      - occurredAt
      - payload
      properties:
        id:
          type: string
          format: uuid
          examples:
          - 0190f4d2-7c1e-7a3b-9e21-5b8c2d4e6f10
        type:
          type: string
          const: chat.receipt
        occurredAt:
          type: string
          format: date-time
          examples:
          - '2026-11-07T11:30:00Z'
        actorId:
          type:
          - string
          - 'null'
          format: uuid
        payload:
          type: object
          properties:
            upToMessageId:
              type: string
              format: uuid
              examples:
              - 0190f4d2-7c1e-7a3b-9e21-5b8c2d4e6f10
            status:
              type: string
              enum:
              - DELIVERED
              - READ
            at:
              type: string
              format: date-time
              examples:
              - '2026-11-07T11:30:00Z'
          required:
          - upToMessageId
          - status
          - at
    ChatTypingEvent:
      type: object
      required:
      - id
      - type
      - occurredAt
      - payload
      properties:
        id:
          type: string
          format: uuid
          examples:
          - 0190f4d2-7c1e-7a3b-9e21-5b8c2d4e6f10
        type:
          type: string
          const: chat.typing
        occurredAt:
          type: string
          format: date-time
          examples:
          - '2026-11-07T11:30:00Z'
        actorId:
          type:
          - string
          - 'null'
          format: uuid
        payload:
          type: object
          properties:
            typing:
              type: boolean
          required:
          - typing
    ChatPinnedEvent:
      type: object
      required:
      - id
      - type
      - occurredAt
      - payload
      properties:
        id:
          type: string
          format: uuid
          examples:
          - 0190f4d2-7c1e-7a3b-9e21-5b8c2d4e6f10
        type:
          type: string
          const: chat.pinned
        occurredAt:
          type: string
          format: date-time
          examples:
          - '2026-11-07T11:30:00Z'
        actorId:
          type:
          - string
          - 'null'
          format: uuid
        payload:
          type: object
          properties:
            messageId:
              type: string
              format: uuid
              examples:
              - 0190f4d2-7c1e-7a3b-9e21-5b8c2d4e6f10
            pinned:
              type: boolean
          required:
          - messageId
          - pinned
    ChatReactionEvent:
      type: object
      required:
      - id
      - type
      - occurredAt
      - payload
      properties:
        id:
          type: string
          format: uuid
          examples:
          - 0190f4d2-7c1e-7a3b-9e21-5b8c2d4e6f10
        type:
          type: string
          const: chat.reaction
        occurredAt:
          type: string
          format: date-time
          examples:
          - '2026-11-07T11:30:00Z'
        actorId:
          type:
          - string
          - 'null'
          format: uuid
        payload:
          type: object
