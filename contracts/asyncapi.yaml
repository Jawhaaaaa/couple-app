          - AUDIO
          - FILE
        status:
          type: string
          enum:
          - PENDING
          - PROCESSING
          - READY
          - FAILED
        mime:
          type: string
          examples:
          - image/jpeg
        sizeBytes:
          type: integer
          format: int64
          minimum: 0
        width:
          type:
          - integer
          - 'null'
          minimum: 1
        height:
          type:
          - integer
          - 'null'
          minimum: 1
        durationMs:
          type:
          - integer
          - 'null'
          minimum: 0
        blurhash:
          type:
          - string
          - 'null'
          examples:
          - LEHV6nWB2yk8pyo0adR*.7kCMdnj
        waveform:
          type:
          - array
          - 'null'
          description: 64 цэгийн долгион (0–1)
          maxItems: 64
          items:
            type: number
            minimum: 0
            maximum: 1
        fileName:
          type:
          - string
          - 'null'
        urls:
          type: object
          required:
          - original
          properties:
            original:
              type: string
              format: uri
              examples:
              - https://s3.aura.example.mn/spaces/x/original?X-Amz-Signature=abc
            sm:
              type: string
              format: uri
              examples:
              - https://aura.example.mn/
            md:
              type: string
              format: uri
              examples:
              - https://aura.example.mn/
            lg:
              type: string
              format: uri
              examples:
              - https://aura.example.mn/
            poster:
              type: string
              format: uri
              examples:
              - https://aura.example.mn/
        urlsExpireAt:
          type: string
          format: date-time
          examples:
