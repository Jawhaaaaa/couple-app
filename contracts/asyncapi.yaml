    CityRef:
      type: object
      required:
      - name
      - countryCode
      - lat
      - lon
      - timezone
      properties:
        name:
          type: string
          examples:
          - Улаанбаатар
        countryCode:
          type: string
          pattern: ^[A-Z]{2}$
          examples:
          - MN
        lat:
          type: number
          minimum: -90
          maximum: 90
          examples:
          - 47.92
        lon:
          type: number
          minimum: -180
          maximum: 180
          examples:
          - 106.92
        timezone:
