# Backend тохиргоо (LLD §4.5). Нууц утга энд бичигдэхгүй — орчны хувьсагчаас (INV-10).
server:
  port: 8080
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

spring:
  application:
    name: aura-backend
  autoconfigure:
    # Хэрэглэгчийн нэр/нууц үгийн анхдагч (generated password) хэрэггүй — JWT (T-18)
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/aura}
    username: ${SPRING_DATASOURCE_USERNAME:aura}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  mvc:
    # Request body/параметрийг логлохгүй (AC-196, DD-AURA-037)
    log-request-details: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    # SMTP түр унавал контейнер «unhealthy» болохгүй
    mail:
      enabled: false
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    # Spring MVC-ийн DEBUG нь body-г `toString`-оор бичдэг — хэзээ ч бүү асаа (AC-196)
    org.springframework.web.servlet.mvc.method.annotation: INFO
    org.springframework.web.HttpLogging: INFO

aura:
  jwt:
    secret: ${AURA_JWT_SECRET:}
  s3:
    endpoint: ${AURA_S3_ENDPOINT:http://localhost:8333}
    public-endpoint: ${AURA_S3_PUBLIC_ENDPOINT:}
    region: ${AURA_S3_REGION:us-east-1}
    bucket: ${AURA_S3_BUCKET:aura-media}
    access-key: ${AURA_S3_ACCESS_KEY:}
    secret-key: ${AURA_S3_SECRET_KEY:}
    path-style: ${AURA_S3_PATH_STYLE:true}
    presign-ttl: ${AURA_S3_PRESIGN_TTL:15m}
  mail:
    from: ${AURA_MAIL_FROM:Aura <no-reply@aura.local>}
  cors:
    allowed-origins: ${AURA_CORS_ALLOWED_ORIGINS:}
  cookie:
    secure: ${AURA_COOKIE_SECURE:true}
  storage:
    quota-bytes: ${AURA_STORAGE_QUOTA_BYTES:10737418240}
    warn-ratio: ${AURA_STORAGE_WARN_RATIO:0.8}
  sentry:
    dsn: ${AURA_SENTRY_DSN:}
    environment: ${AURA_SENTRY_ENVIRONMENT:${spring.profiles.active:default}}
    release: ${AURA_APP_LATEST_VERSION:}
  policy:
    version: ${AURA_POLICY_VERSION:2026-11-07}
